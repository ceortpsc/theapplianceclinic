version: '3.8'

# Production Docker Compose
# All sensitive values MUST be supplied via environment variables or Docker Secrets.
# Never hardcode credentials in this file. Use a .env file (excluded from git) or
# a secrets manager (e.g., AWS Secrets Manager, HashiCorp Vault).

services:
  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ../
      dockerfile: apps/api-gateway/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      NODE_ENV: production
      PORT: 4000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.theapplianceclinic.com}
    ports:
      - "4000:4000"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - internal-net
    restart: unless-stopped

  web-client:
    build:
      context: ../apps/web-client
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - internal-net
    restart: unless-stopped

networks:
  internal-net:
    driver: bridge

volumes:
  pgdata:

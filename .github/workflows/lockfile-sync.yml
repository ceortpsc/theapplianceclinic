name: Synchronize Tested npm Lockfile

on:
  push:
    branches:
      - 'enterprise/**'
    paths:
      - 'package.json'
      - 'apps/**/package.json'
      - 'packages/**/package.json'
      - '.github/workflows/lockfile-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appliance-clinic-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout client product branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate workspace dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high

      - name: Commit tested lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json is already synchronized.'
            exit 0
          fi
          git config user.name 'appliance-clinic-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: synchronize tested npm dependency graph'
          git push origin "HEAD:${GITHUB_REF_NAME}"

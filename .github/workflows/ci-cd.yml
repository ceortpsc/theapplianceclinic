name: Enterprise Client POS Monorepo CI/CD Pipeline

on:
  push:
    branches: [main, 'enterprise/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appliance-clinic-legacy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/appliance_clinic_ci?schema=public'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out independent client product
        uses: actions/checkout@v4

      - name: Initialize Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install monorepo dependencies
        run: npm install --no-audit --no-fund

      - name: Validate and generate shared database schema
        run: |
          npm run schema:validate
          npm run schema:generate

      - name: Test material store workflow controls
        run: npm run test --workspace=@clinic/api-gateway -- operations-registry.service.spec.ts --runInBand

      - name: Run available lint tasks
        run: npx turbo run lint --continue

      - name: Run available test tasks
        run: npx turbo run test --continue

      - name: Build Next.js and NestJS applications
        run: npm run build

      - name: Enforce independent-client boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='package.json' '(@ross/|WORKSPACEIRS|rtpsctaxplatform|rtpsc-backoffice)' apps packages package.json; then
            echo 'RTPSC tax-software runtime coupling is prohibited in The Appliance Clinic client product.' >&2
            exit 1
          fi
